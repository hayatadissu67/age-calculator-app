<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- displays site properly based on user's device -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Age calculator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center bg-gray-100 font-[poppins]"
  >
    <div
      class="flex justify-center items-left bg-white w-[450px] h-50 flex-col shadow-lg p-8 m-auto rounded-xl rounded-br-[100px]"
    >
      <header class="flex items-left gap-4">
        <div>
          <div class="text-sm font-bold text-gray-500 tracking-widest">Day</div>
          <div>
            <input
             id="day"
              type="number"
              placeholder="DD"
              class="border border-gray-300 h-10 w-20 rounded pl-2"
            />
          </div>
        </div>
        <div>
          <div class="text-sm font-bold text-gray-500 tracking-widest">Month</div>
          <div>
            <input
              id="month"
              type="number"
              placeholder="MM"
              class="border border-gray-300 h-10 w-20 rounded pl-2"
            />
          </div>
        </div>
        <div>
          <div class="text-sm font-bold text-gray-500 tracking-widest">Year</div>
          <div>
            <input
              id="year"
              type="number"
              placeholder="YYYY"
              class="border border-gray-300 h-10 w-20 rounded pl-2"
            />
          </div>
        </div>
      </header>
      <section class="flex flex-row justify-between items-center w-full">
        <hr class="border-gray-300 mb-8 w-[90%]" />
        <button
          class="flex justify-center items-center mb-8 bg-purple-600 w-10 h-10 rounded-full"
          id="calculate-btn"
        >
          <img src="assets/images/icon-arrow.svg" alt="Arrow" class="w-5 h-5" />
        </button>
      </section>
      <div class="flex flex-col ">
        <div class="flex flex-row  items-center w-full">
          <div id="disyear" class="text-7xl font-bold text-purple-500">--</div>
          <div class="text-5xl font-extrabold text-black-500 font-[Poppins]">years</div>
        </div>
        <div class="flex flex-row  items-center w-full">
          <div id="dismonth" class="text-7xl font-bold text-purple-500">--</div>
          <div class="text-5xl font-extrabold text-black-500 font-[Poppins]">months</div>
        </div>
        <div class="flex flex-row  items-center w-full">
          <div id="disday" class="text-7xl font-bold text-purple-500">--</div>
          <div class="text-5xl font-extrabold font-[Poppins] text-black-500" >days</div>
        </div>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Hayat</a>.
    </footer>
  </body>
</html>
